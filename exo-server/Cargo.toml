[package]
name = "exo-server"
version = "0.1.0"
edition = "2021"

[features]
range_checked = []
debug = []
arb = []
std = []

[dependencies]
rocket = "0.5.1"
socketcan = "3.5.0"
bitvec = { version = "1.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.138"
ws = { package = "rocket_ws", version = "0.1.1" }
tokio = { version = "1.34", features = ["rt-multi-thread", "macros", "fs", "time"] }
chrono = { version = "0.4", features = ["serde"] }
ssh2 = "0.9"
anyhow = "1.0"
dirs = "4.0"
futures = "0.3"


[build-dependencies]
dbc-codegen = "0.3"
